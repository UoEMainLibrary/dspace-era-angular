<header class="container-masthead">
    <div class="container">
        <div _ngcontent-dspace-angular-c183="" class="uoe-logo">
            <a _ngcontent-dspace-angular-c183="" title="Link to the Univeristy of Edinburgh's home page" alt="Image of the Univeristy of Edinburgh's logo" href="https://www.ed.ac.uk/">
                <img _ngcontent-dspace-angular-c183="" alt="University of Edinburgh Library Logo" src="/assets/era/images/uoe-logo-long.png">
            </a>
        </div>
    </div>
</header>
<header>
    <div class="container">
        <div class="d-flex flex-row justify-content-between">
            <a class="navbar-brand my-2" routerLink="/home">
                <img src="assets/era/images/era-logo.png" [attr.alt]="'menu.header.image.logo' | translate"
                    class="era-logo"/>
            </a>
            <h1 class="navbar-header">Edinburgh Research Archive</h1>
            <div *ngIf="isMobile$ | async" class="mobile-menu me-2">
                <button class="navbar-toggler px-0" type="button" (click)="toggleNavbar()"
                        aria-controls="collapsingNav"
                        aria-expanded="false" [attr.aria-label]="'nav.toggle' | translate">
                    <span class="fas fa-bars fa-fw toggler-icon" aria-hidden="true"></span>
                </button>
            </div>
        </div>
    </div>
</header>
